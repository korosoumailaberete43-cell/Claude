*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:#0B1624;color:#F3F0EA;font-family:Manrope;position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(#1d2e42 1.5px,transparent 1.5px),linear-gradient(90deg,#1d2e42 1.5px,transparent 1.5px);background-size:54px 54px;opacity:.55}
.frame{position:absolute;left:90px;right:150px;top:250px;bottom:470px;display:flex;flex-direction:column;justify-content:center}
.top{position:absolute;left:90px;right:150px;top:160px;display:flex;justify-content:space-between;align-items:center}
.mini svg{display:block}
.count{font:500 22px Mono;letter-spacing:.2em;color:#aeb7c2}
.band{position:absolute;left:0;bottom:380px}
.next{position:absolute;right:140px;bottom:450px;font:600 64px Sora;color:#C8773F}
.kick{font:500 24px Mono;letter-spacing:.22em;text-transform:uppercase;color:#35D0DE;margin-bottom:34px}
h1.cover{font:600 104px/1.04 Sora;letter-spacing:-3px}
h2{font:600 76px/1.1 Sora;letter-spacing:-2px;margin-bottom:30px}
h2.small{font-size:58px;margin-bottom:40px}
.hl{font-style:normal;color:#C8773F}
.lead{font:500 40px/1.45 Manrope;color:#aeb7c2;margin-top:36px;max-width:820px}
.body{font:500 40px/1.5 Manrope;color:#aeb7c2;max-width:860px}
.body .hl{color:#E3A56C}
.center{text-align:center;margin-left:auto;margin-right:auto}
.num{font:700 150px/1 Sora;color:#C8773F;margin-bottom:24px;letter-spacing:-4px}
.huge{font:700 230px/1 Sora;color:#C8773F;text-align:center;letter-spacing:-8px;margin-bottom:40px}
.ill{margin-bottom:40px}
.ill.wide svg{max-width:100%}
.ill.sym{align-self:center}
.qmark{font:400 220px/0.6 InstrumentSerif;color:#C8773F;height:140px}
blockquote{font:italic 400 84px/1.18 InstrumentSerif}
.by{font:500 24px Mono;letter-spacing:.2em;text-transform:uppercase;color:#aeb7c2;margin-top:40px}
.swipe{margin-top:60px;align-self:flex-start;font:600 34px Sora;color:#0B1624;background:#C8773F;padding:18px 34px;border-radius:60px}
.swipe span{margin-left:10px}
.ghost{position:absolute;right:-300px;top:120px;opacity:0.07}
.cmp{border-radius:22px;padding:34px 40px;margin-bottom:26px}
.cmp .tag{font:500 22px Mono;letter-spacing:.22em;text-transform:uppercase;margin-bottom:14px}
.cmp p{font:600 44px/1.3 Sora;letter-spacing:-1px}
.cmp.bad{border:3px dashed #aeb7c2;opacity:.75}
.cmp.bad p{text-decoration:line-through;text-decoration-thickness:4px;text-decoration-color:#C8773F}
.cmp.bad .tag{color:#aeb7c2}
.cmp.good{background:#1C2B3D;border-left:12px solid #C8773F}
.cmp.good .tag{color:#35D0DE}
.panel{background:#1C2B3D;border-radius:22px;padding:30px 36px;margin:10px 0 36px;color:#F3F0EA}
.panel .ph{font:500 20px Mono;letter-spacing:.2em;color:#B9BEC4;margin-bottom:16px}
.panel .row{display:flex;justify-content:space-between;font:400 30px Mono;padding:16px 0;border-bottom:1.5px solid #2a3b50}
.panel .row span{color:#B9BEC4}
.panel .btn{margin-top:24px;margin-left:auto;width:max-content;background:#C8773F;color:#0B1624;font:500 26px Mono;letter-spacing:.2em;padding:16px 34px;border-radius:12px}
.steps{position:relative;padding-left:70px}
.steps:before{content:"";position:absolute;left:18px;top:20px;bottom:20px;width:8px;background:#C8773F}
.step{position:relative;margin-bottom:40px}
.step i{position:absolute;left:-66px;top:8px;width:36px;height:36px;border-radius:50%;background:#F3F0EA;border:6px solid #0B1624}
.step.on i{background:#35D0DE;box-shadow:0 0 0 10px rgba(53,208,222,.2)}
.step b{font:600 40px Sora;display:block}
.step p{font:500 30px/1.4 Manrope;color:#aeb7c2;margin-top:6px}
.logo{align-self:center;margin-bottom:50px}
.acts{display:flex;gap:18px;justify-content:center;margin-top:44px;flex-wrap:wrap}
.acts span{font:500 24px Mono;letter-spacing:.14em;text-transform:uppercase;border:2.5px solid #C8773F;color:#E3A56C;padding:14px 24px;border-radius:40px}
