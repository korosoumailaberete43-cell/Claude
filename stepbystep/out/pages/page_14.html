*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1123px;height:794px}
body{font-family:Nunito;color:#111111;-webkit-font-smoothing:antialiased}
.page{width:1123px;height:794px;position:relative;overflow:hidden;padding:54px 64px}
.light{background:#FAF7F0} .dark{background:#111111;color:#FAF7F0}
.folio{position:absolute;left:64px;right:64px;bottom:28px;display:flex;justify-content:space-between;align-items:center;
  font:700 9px Comfortaa;letter-spacing:2.4px;text-transform:uppercase;color:#5E5A52}
.dark .folio{color:#9C958A}
.folio .m{display:inline-flex;flex-direction:column;gap:1.5px;align-items:flex-end;vertical-align:middle} .folio .m i{display:block;height:2.5px}
.kicker{font:700 11px Comfortaa;letter-spacing:3px;text-transform:uppercase;color:#8A6A00}
.dark .kicker{color:#F5C518}
h1{font:600 40px/1.08 Quicksand;letter-spacing:-.8px}
h2{font:600 25px/1.15 Quicksand;letter-spacing:-.3px}
h3{font:700 15px/1.3 Quicksand}
p{font-size:13.5px;line-height:1.62;color:#3B3832}
.dark p{color:#C9C2B4}
.lab{font:700 9.5px Comfortaa;letter-spacing:2px;text-transform:uppercase;color:#5E5A52}
.card{background:#FFFFFF;border-radius:10px}
.or{color:#8A6A00} .dark .or{color:#F5C518}

figure{margin:0} figure img{display:block;border-radius:6px;box-shadow:0 6px 18px rgba(17,17,17,.14)}
